name: ci

on:
  push:
  pull_request:

# A second push to the same branch makes the first run pointless, so drop it
# rather than pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  iris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=integrations/iris python3 -m unittest discover -s integrations/iris/tests -v

  evan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=integrations/iris:integrations/evan python3 -m unittest discover -s integrations/evan/tests -v

  memory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/langchain-memory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - run: uv sync --locked --extra test --python 3.12
      - run: uv run --locked pytest

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [".", "carl"]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml already names the channel and the components, so
      # rustup only has to be told to obey it rather than be given a version
      # here that could drift away from the one the repo asks for.
      - name: Install the toolchain the repo asks for
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            carl/target
          key: cargo-${{ runner.os }}-${{ matrix.directory }}-${{ hashFiles('Cargo.lock', 'carl/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Formatting first. It is the cheapest to fix and the noisiest to leave.
      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets -- -D warnings

      # Spawns real processes and signals them, so it needs a real machine
      # rather than anything sandboxed away from /proc.
      - run: cargo test --workspace
