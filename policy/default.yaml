# Capability policy. Evaluated by Aos.Broker; the most specific matching rule wins.
#
# verdict: allow | prompt | deny
# Tiers escalate Read -> Write -> System -> Destructive.

tiers:
  Read:        { verdict: allow }
  Write:       { verdict: prompt }
  System:      { verdict: prompt, dryRunOnly: true }
  Destructive: { verdict: prompt, dryRunOnly: true }

# Per-capability overrides, keyed by CapabilityDescriptor.Id.
capabilities:
  # Trusted read-heavy paths worth auto-allowing to keep routines quiet.
  aos-files/file.search:      { verdict: allow }
  aos-windows/ui.tree:        { verdict: allow }
  aos-windows/window.list:    { verdict: allow }

  # Never, on any machine.
  aos-shell/exec.raw:         { verdict: deny, reason: "Use a declared capability, not raw shell." }

# Executables aos-shell may launch. Arguments are passed as a list and never handed to a
# shell, so pipes and redirection cannot be smuggled in through them.
#
# READ THIS BEFORE ADDING A COMMAND.
#
# An allowlist bounds which binary starts, not what that binary can then do. Any interpreter
# accepts code on its own argument vector, with no shell and no escaping trick needed:
#
#     node -e "..."          python -c "..."         dotnet script ...
#     git -c alias.x='!...' x                        npm run <any script from package.json>
#
# So listing an interpreter here grants arbitrary code execution as your user, which silently
# confers every capability the other servers carefully gate: the child inherits the full user
# token and can read %USERPROFILE%\.ssh and everything in denyPaths. node, python, npm, npx
# and dotnet were in this list and were removed for exactly that reason.
#
# What remains is commands whose argument surface does not include "run this code". git is
# kept because it is the day-to-day need, with its escape hatches blocked in deniedArguments
# below.
allowedCommands:
  - git
  - gh

# Argument patterns refused per command, matched case-insensitively against each argument.
# This is what keeps git on the list: -c can define an alias beginning with '!', which git
# executes through a shell, and --upload-pack / --receive-pack name a program to run.
deniedArguments:
  git:
    - "^-c$"
    - "^--exec-path"
    - "^--upload-pack"
    - "^--receive-pack"
    - "^-{1,2}(c|config-env)="
  gh:
    - "^--template"      # Go template evaluation
    - "^api$"            # arbitrary authenticated API calls, including mutations

# Folders the file capabilities may work inside. Anything outside these is refused before
# a tier is even considered. Leave the list empty to allow the whole filesystem, which is
# not recommended. Add roots as you need them rather than widening pre-emptively.
allowedRoots:
  - "%USERPROFILE%\\Desktop"
  - "%USERPROFILE%\\Documents"
  - "%USERPROFILE%\\Downloads"
  - "%USERPROFILE%\\Pictures"
  - "%USERPROFILE%\\OneDrive\\Desktop"
  - "%USERPROFILE%\\OneDrive\\Documents"
  - "%LOCALAPPDATA%\\AgenticOS"

# Paths the agent may never touch, regardless of tier or verdict.
denyPaths:
  - "C:\\Windows\\System32"
  - "C:\\Program Files"
  - "%USERPROFILE%\\.ssh"
  - "%APPDATA%\\Roaming\\Claude"

# Destructive file operations move here instead of deleting. Swept manually.
trashPath: "%LOCALAPPDATA%\\AgenticOS\\trash"
auditPath: "%LOCALAPPDATA%\\AgenticOS\\audit"
